<!DOCTYPE html>
<html>
<head>
  <title>Change Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .password-container {
      background: white;
      padding: 30px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="password-container">
    <h2>Change Password</h2>
    <div id="successMsg" class="message success hidden">Password changed successfully</div>
    <div id="errorMsg" class="message error hidden">Error changing password</div>
    
    <form id="passwordForm">
      <input type="password" id="currentPassword" placeholder="Current Password" required>
      <input type="password" id="newPassword" placeholder="New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
      <button type="submit">Change Password</button>
    </form>
    
    <div style="margin-top: 15px; text-align: center;">
      <a href="dashboard.html">Back to Dashboard</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5001/api/faculty';
    
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Reset messages
      document.getElementById('successMsg').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
      
      // Check if passwords match
      if (newPassword !== confirmPassword) {
        document.getElementById('errorMsg').textContent = 'New passwords do not match';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }
      
      try {
        const token = localStorage.getItem('facultyToken');
        if (!token) {
          window.location.href = 'index.html';
          return;
        }
        
        const response = await fetch(`${API_URL}/change-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-faculty-token': token
          },
          body: JSON.stringify({
            currentPassword,
            newPassword
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('successMsg').textContent = data.message;
          document.getElementById('successMsg').classList.remove('hidden');
          document.getElementById('passwordForm').reset();
          
          // Update localStorage to reflect that password has been changed
          const faculty = JSON.parse(localStorage.getItem('faculty'));
          if (faculty) {
            faculty.firstLogin = false;
            localStorage.setItem('faculty', JSON.stringify(faculty));
          }
          
          // Redirect to dashboard after 2 seconds
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 2000);
        } else {
          document.getElementById('errorMsg').textContent = data.message;
          document.getElementById('errorMsg').classList.remove('hidden');
        }
      } catch (err) {
        console.error('Error:', err);
        document.getElementById('errorMsg').textContent = 'Server error. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
